name: network-monitor

services:
    nginx:
        image: nginx:alpine
        ports:
            - "${DOCKER_HOST_PORT:-3000}:80"
        volumes:
            - "./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro"
        depends_on:
            - server-node
            - client-node

    client-node:
        build:
            context: ./client
            target: runner
            dockerfile: Dockerfile

    server-node:
        build:
            context: ./server
            target: runner
            dockerfile: Dockerfile
        environment:
            - "SERVER_PORT=8080"
            - "DATABASE_PATH=/usr/src/app/storage/sqlite.db"
        volumes:
            - "sqlite:/usr/src/app/storage"

volumes:
    sqlite:
