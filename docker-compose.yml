name: network-monitor

services:
    server:
        build:
            context: .
            target: development
        command: sh -c "npm install --include=dev && npm run start:dev"
        ports:
            - "8080:8080"
        env_file:
            - "./server/.env"
        environment:
            - "NODE_ENV=development"
        volumes:
            - "./server:/app"
            - "server_node_modules:/app/node_modules"

    client:
        build:
            context: .
            target: development
        command: sh -c "npm install --include=dev && npm run start:dev -- --host --port 3000"
        ports:
            - "3000:3000"
        env_file:
            - "./client/.env"
        environment:
            - "NODE_ENV=development"
            - "VITE_API_BASE_URL=http://127.0.0.1:8080"
        volumes:
            - "./client:/app"
            - "client_node_modules:/app/node_modules"
        depends_on:
            - server

volumes:
    server_node_modules:
    client_node_modules:
