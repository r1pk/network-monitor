name: network-monitor__server

services:
    mysql:
        container_name: network-monitor__server-mysql
        image: mysql:9.0.0
        environment:
            - "MYSQL_DATABASE=network-monitor"
            - "MYSQL_ALLOW_EMPTY_PASSWORD=true"
        volumes:
            - "mysql:/var/lib/mysql"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            timeout: 10s
            retries: 10

    node:
        container_name: network-monitor__server-node
        build:
            context: .
            target: runner
            dockerfile: ./Dockerfile
        ports:
            - "${DOCKER_HOST_PORT:-8080}:8080"
        environment:
            - "SERVER_PORT=8080"
            - "DATABASE_HOST=mysql"
            - "DATABASE_PORT=3306"
            - "DATABASE_NAME=network-monitor"
            - "DATABASE_USER=root"
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    mysql:
        external: false
