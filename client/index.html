<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Network Monitor</title>
    </head>
    <body class="bg-noise-backdrop min-h-dvh bg-zinc-950 text-zinc-100 antialiased">
        <div id="app">
            <main class="mx-auto flex max-w-7xl flex-col gap-6 px-4 py-10 md:px-6 md:py-16">
                <header class="border-b border-zinc-800 pb-6">
                    <h1 class="flex items-baseline gap-2">
                        <span class="text-xl font-semibold tracking-tight">Network Monitor</span>
                        <span aria-hidden="true" class="font-mono text-base text-zinc-700">/</span>
                        <span class="text-base font-medium tracking-wide text-zinc-500">Dashboard</span>
                    </h1>
                </header>
                <section class="flex flex-wrap items-center justify-end gap-4" data-filters>
                    <div class="flex items-center gap-2 rounded-md border border-zinc-800 bg-zinc-900 px-4 py-2 transition-colors focus-within:border-emerald-500" data-filter="since">
                        <label for="since" class="text-xs font-medium tracking-wide text-zinc-500 uppercase">Since</label>
                        <input type="date" id="since" class="bg-transparent font-mono text-sm text-zinc-100 focus:outline-none" data-value>
                    </div>
                </section>
                <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4" aria-label="Average metrics" data-average-metrics>
                    <article class="flex flex-col gap-6 rounded-md border border-zinc-800 bg-zinc-900 p-6" data-average-metric="download">
                        <div class="flex items-center justify-between">
                            <p class="text-xs font-medium tracking-wide text-zinc-500 uppercase" data-label>Download</p>
                            <div class="flex size-10 items-center justify-center rounded-sm bg-zinc-950 ring-1 ring-emerald-500/50 ring-inset">
                                <img src="/icons/download.svg" alt="" width="24" height="24" class="size-6">
                            </div>
                        </div>
                        <p class="font-mono text-3xl leading-none font-semibold tracking-tight tabular-nums">
                            <span data-value>--</span>
                            <span class="text-base font-normal text-zinc-500" data-unit>Mbps</span>
                        </p>
                    </article>
                    <article class="flex flex-col gap-6 rounded-md border border-zinc-800 bg-zinc-900 p-6" data-average-metric="upload">
                        <div class="flex items-center justify-between">
                            <p class="text-xs font-medium tracking-wide text-zinc-500 uppercase" data-label>Upload</p>
                            <div class="flex size-10 items-center justify-center rounded-sm bg-zinc-950 ring-1 ring-sky-500/50 ring-inset">
                                <img src="/icons/upload.svg" alt="" width="24" height="24" class="size-6">
                            </div>
                        </div>
                        <p class="font-mono text-3xl leading-none font-semibold tracking-tight tabular-nums">
                            <span data-value>--</span>
                            <span class="text-base font-normal text-zinc-500" data-unit>Mbps</span>
                        </p>
                    </article>
                    <article class="flex flex-col gap-6 rounded-md border border-zinc-800 bg-zinc-900 p-6" data-average-metric="ping">
                        <div class="flex items-center justify-between">
                            <p class="text-xs font-medium tracking-wide text-zinc-500 uppercase" data-label>Latency</p>
                            <div class="flex size-10 items-center justify-center rounded-sm bg-zinc-950 ring-1 ring-amber-500/50 ring-inset">
                                <img src="/icons/ping.svg" alt="" width="24" height="24" class="size-6">
                            </div>
                        </div>
                        <p class="font-mono text-3xl leading-none font-semibold tracking-tight tabular-nums">
                            <span data-value>--</span>
                            <span class="text-base font-normal text-zinc-500" data-unit>ms</span>
                        </p>
                    </article>
                    <article class="flex flex-col gap-6 rounded-md border border-zinc-800 bg-zinc-900 p-6" data-average-metric="loss">
                        <div class="flex items-center justify-between">
                            <p class="text-xs font-medium tracking-wide text-zinc-500 uppercase" data-label>Packet Loss</p>
                            <div class="flex size-10 items-center justify-center rounded-sm bg-zinc-950 ring-1 ring-rose-500/50 ring-inset">
                                <img src="/icons/loss.svg" alt="" width="24" height="24" class="size-6">
                            </div>
                        </div>
                        <p class="font-mono text-3xl leading-none font-semibold tracking-tight tabular-nums">
                            <span data-value>--</span>
                            <span class="text-base font-normal text-zinc-500" data-unit>%</span>
                        </p>
                    </article>
                </section>
                <section class="grid grid-cols-1 gap-4 lg:grid-cols-2" aria-label="Charts" data-charts>
                    <div class="flex h-96 flex-col gap-4 rounded-md border border-zinc-800 bg-zinc-900 p-6" data-chart="download">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-medium tracking-wide text-zinc-400 uppercase">Download Speed</span>
                            <span class="text-xs text-zinc-400" data-legend></span>
                        </div>
                        <div class="relative flex flex-1 items-center justify-center overflow-hidden rounded-sm bg-zinc-950" data-value></div>
                    </div>
                    <div class="flex h-96 flex-col gap-4 rounded-md border border-zinc-800 bg-zinc-900 p-6" data-chart="upload">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-medium tracking-wide text-zinc-400 uppercase">Upload Speed</span>
                            <span class="text-xs text-zinc-400" data-legend></span>
                        </div>
                        <div class="relative flex flex-1 items-center justify-center overflow-hidden rounded-sm bg-zinc-950" data-value></div>
                    </div>
                    <div class="flex h-96 flex-col gap-4 rounded-md border border-zinc-800 bg-zinc-900 p-6" data-chart="ping">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-medium tracking-wide text-zinc-400 uppercase">Latency</span>
                            <span class="text-xs text-zinc-400" data-legend></span>
                        </div>
                        <div class="relative flex flex-1 items-center justify-center overflow-hidden rounded-sm bg-zinc-950" data-value></div>
                    </div>
                    <div class="flex h-96 flex-col gap-4 rounded-md border border-zinc-800 bg-zinc-900 p-6" data-chart="loss">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-medium tracking-wide text-zinc-400 uppercase">Packet Loss</span>
                            <span class="text-xs text-zinc-400" data-legend></span>
                        </div>
                        <div class="relative flex flex-1 items-center justify-center overflow-hidden rounded-sm bg-zinc-950" data-value></div>
                    </div>
                </section>
            </main>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
